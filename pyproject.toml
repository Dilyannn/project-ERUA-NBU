[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "erua-image-model"
version = "0.1.0"
description = "Sclera segmentation experiments for project-ERUA-NBU"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
transfuse = [
    "einops",
    "numpy",
    "opencv-python-headless>=4.8",
    "Pillow",
    "timm",
    "torch>=2.6",
    "torchvision",
]

[project.scripts]
erua-transfuse = "image_model.transfuse:main"
erua-score-masks = "image_model.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]
